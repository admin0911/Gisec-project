[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gisec-poison-features"
version = "0.1.0"
description = "Standalone detector-ready feature extraction for PoisonGuard"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
  "pillow>=10.0",
  "torch>=2.2",
  "torchvision>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

